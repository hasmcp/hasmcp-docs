                        $ref: "#/components/schemas/Interceptor"
              resources:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderResourceCreate"
              prompts:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderPromptCreate"
    JSONRPCRequest:
      type: object
      required: ["jsonrpc", "method"]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
          example: tools/call
        params:
          type: object
          additionalProperties: true
    Settings:
      type: object
      description: Secrets are never returned; send an empty secret to keep the saved one.
      properties:
        domain:
          type: object
          properties:
            domainName:
              type: string
            mcpBaseURL:
              type: string
            mcpProxyURL:
              type: string
            oauth2HTTPScheme:
              type: string
        server:
          type: object
          properties:
            port:
              type: integer
            maxBodySizeInBytes:
              type: integer
            trustedProxies:
              type: array
              items:
                type: string
            idNode:
              type: integer
        tls:
          type: object
          properties:
            enabled:
              type: boolean
            port:
              type: integer
            email:
              type: string
        database:
          type: object
          properties:
            driver:
              type: string
              enum: ["sqlite", "postgres"]
            sqliteDSN:
              type: string
            postgresDSN:
              type: string
              writeOnly: true
        storage:
          type: object
          properties:
            s3:
              type: object
              properties:
                endpoint:
                  type: string
                region:
                  type: string
                bucket:
                  type: string
                accessKey:
                  type: string
                secretAccessKey:
                  type: string
                  writeOnly: true
                publicBucketURL:
                  type: string
        accounts:
          type: object
          properties:
            serviceEnabled:
              type: boolean
            baseURL:
              type: string
            adminBaseURL:
              type: string
        git:
          type: object
          properties:
            httpScheme:
              type: string
            github:
              type: object
              properties:
                appName:
                  type: string
                appID:
                  type: string
                clientID:
                  type: string
                clientSecret:
                  type: string
                  writeOnly: true
                privateKey:
                  type: string
                  writeOnly: true
                privateKeyPath:
                  type: string
            gitlab:
              type: object
              properties:
                clientID:
                  type: string
                clientSecret:
                  type: string
                  writeOnly: true
        apis:
          type: object
          properties:
            api:
              $ref: "#/components/schemas/APISettings"
            hub:
              $ref: "#/components/schemas/APISettings"
            mcp:
              $ref: "#/components/schemas/APISettings"
            oauth2:
              $ref: "#/components/schemas/APISettings"
            configurationAPI:
              $ref: "#/components/schemas/APISettings"
        secrets:
          type: object
          properties:
            hashSalt:
              type: string
              writeOnly: true
            authenticationSecret:
              type: string
              writeOnly: true
            mcpJWTSecret:
              type: string
              writeOnly: true
            oauth2JWTSecret:
              type: string
              writeOnly: true
    APISettings:
      type: object
      properties:
        corsHostnames:
          type: array
          items:
            type: string
        loggerEnabled:
          type: boolean
        authenticationEnabled:
          type: boolean
        authorizationEnabled:
          type: boolean
        rateLimit:
          type: object
          properties:
            enabled:
              type: boolean
            maxPerIP:
              type: integer
            window:
              type: string
              example: "1m"
    SettingsResponse:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/Settings"
        secretsSet:
          type: object
          description: Which secrets have a saved value
          properties:
            postgresDSN:
              type: boolean
            s3SecretAccessKey:
              type: boolean
            githubClientSecret:
              type: boolean
            githubPrivateKey:
              type: boolean
            gitlabClientSecret:
              type: boolean
            hashSalt:
              type: boolean
            authenticationSecret:
              type: boolean
            mcpJWTSecret:
              type: boolean
            oauth2JWTSecret:
              type: boolean
        restartRequired:
          type: boolean
          description: The saved settings differ from the ones the server started with
        insecureRootToken:
          type: boolean
          description: The root access token is a well known default
