  /setup/v1/settings:
    servers:
      - url: https://app.hasmcp.com
    get:
      summary: Get Settings
      description: >-
        Returns the settings without their secrets; secretsSet tells which
        secrets have a value. Needs the root access token
        (HASMCP_APP_API_ACCESS_TOKEN) as the bearer token. Limited to 30
        requests a minute per IP.
      operationId: getSettings
      tags: ["Setup"]
      security:
        - rootToken: []
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          $ref: "#/components/responses/SetupError"
        "429":
          description: Too many requests
    put:
      summary: Save Settings
      description: >-
        Saves every setting except the root access token and the encryption
        key, which stay in the environment. An empty secret keeps the saved
        one. Most settings take effect after a restart, see restartRequired.
        Needs the root access token as the bearer token.
      operationId: saveSettings
      tags: ["Setup"]
      security:
        - rootToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: The saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "400":
          $ref: "#/components/responses/SetupError"
        "401":
          $ref: "#/components/responses/SetupError"
        "422":
          $ref: "#/components/responses/SetupError"
        "429":
          description: Too many requests
        "500":
          $ref: "#/components/responses/SetupError"
  /mcp/{id}:
    servers:
      - url: https://app.hasmcp.com
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: MCP Server ID
    post:
      summary: MCP JSON-RPC Request
      description: >-
        The Streamable HTTP endpoint of an MCP server. Takes a JSON-RPC 2.0
        request and answers with JSON or an event stream. Authenticate with a
        server token in the x-hasmcp-key header ("Bearer <token>") or the token
        query parameter. An Authorization header, or the authorization query
        parameter, is passed to the upstream APIs.
      operationId: mcpCall
      tags: ["MCP"]
      security:
        - mcpKey: []
        - mcpKeyQuery: []
      parameters:
        - $ref: "#/components/parameters/McpSessionID"
        - $ref: "#/components/parameters/McpProtocolVersion"
        - name: authorization
          in: query
          required: false
          description: Token sent upstream as "Bearer <value>" when there is no Authorization header.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JSONRPCRequest"
      responses:
        "200":
          description: The JSON-RPC response, or an event stream of messages
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        "202":
          description: A notification or response was accepted
        "400":
          description: Not a JSON-RPC 2.0 request
        "401":
          description: The server token is missing, invalid or expired
        "402":
          description: The organization has no quota left
    get:
      summary: MCP Server Event Stream
      description: Opens the event stream of a session for messages from the server.
      operationId: mcpStream
      tags: ["MCP"]
      security:
        - mcpKey: []
        - mcpKeyQuery: []
      parameters:
        - $ref: "#/components/parameters/McpSessionID"
        - name: last-event-id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: The server token is missing, invalid or expired
    delete:
      summary: End MCP Session
      operationId: mcpDeleteSession
      tags: ["MCP"]
      security:
        - mcpKey: []
        - mcpKeyQuery: []
      parameters:
        - $ref: "#/components/parameters/McpSessionID"
      responses:
        "204":
          description: The session ended
        "401":
          description: The server token is missing, invalid or expired
  /mcp/{id}/logs:
    servers:
      - url: https://app.hasmcp.com
    get:
      summary: MCP Server Debug Stream
      description: >-
        Streams what the server does as server-sent events: client requests
        («), their responses (»), upstream API calls (ⓘ .api.call) and
        warnings (⚠). Needs a server token with the "server:tail" scope.
      operationId: mcpTail
      tags: ["MCP"]
      security:
        - mcpKey: []
        - mcpKeyQuery: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: MCP Server ID
      responses:
        "200":
          description: The debug event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: The server token is missing, invalid, expired or lacks the server:tail scope
  /oauth2/authorize:
    servers:
      - url: https://app.hasmcp.com
    get:
      summary: Start Provider Authorization
      description: >-
        Redirects the user to the provider's authorization page. The web app
        gets this URL from the authorize provider endpoint.
      operationId: oauth2Authorize
      tags: ["OAuth2"]
      parameters:
        - name: provider_id
          in: query
          required: true
          schema:
            type: string
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
        - name: server_id
          in: query
          required: false
          description: Connects the account for this MCP server only
          schema:
            type: string
      responses:
        "307":
          description: Redirect to the provider's authorization page
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /oauth2/callback:
    servers:
      - url: https://app.hasmcp.com
    get:
      summary: Provider Authorization Callback
      description: Saves the provider's tokens as variables and redirects back to the web app.
      operationId: oauth2Callback
      tags: ["OAuth2"]
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuth2State"
        - $ref: "#/components/parameters/OAuth2Code"
      responses:
        "307":
          description: Redirect back to the web app
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /git-oauth2/authorize:
    servers:
      - url: https://app.hasmcp.com
    get:
      summary: Start Git Connection
      description: Redirects the user to GitHub or GitLab to connect a Git account.
      operationId: gitOAuth2Authorize
      tags: ["OAuth2"]
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: ["github", "gitlab"]
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "307":
          description: Redirect to the Git provider
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /git-oauth2/callback:
    servers:
      - url: https://app.hasmcp.com
    get:
      summary: Git Connection Callback
      description: Saves the Git connection and redirects back to the web app.
      operationId: gitOAuth2Callback
      tags: ["OAuth2"]
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuth2State"
        - $ref: "#/components/parameters/OAuth2Code"
        - name: installation_id
          in: query
          required: false
          description: The GitHub App installation
          schema:
            type: string
      responses:
        "307":
          description: Redirect back to the web app
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Enter 'Bearer' followed by a space and your token (e.g., 'Bearer ${HASMCP_ACCESS_TOKEN}')."
    rootToken:
      type: http
      scheme: bearer
      description: The root access token, HASMCP_APP_API_ACCESS_TOKEN.
    mcpKey:
      type: apiKey
      in: header
      name: x-hasmcp-key
      description: "A server token as 'Bearer <token>'."
    mcpKeyQuery:
      type: apiKey
      in: query
      name: token
      description: A server token, for clients that cannot set headers.
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.hasmcp.com/oauth2/auth
          tokenUrl: https://accounts.hasmcp.com/oauth2/token
          scopes:
            "gitconnection:list": List Git connections
            "gitconnection:delete": Delete Git connection
            "variable:list": List variables
            "variable:create": Create variable
            "variable:update": Update variable
            "variable:delete": Delete variable
            "provider:list": List providers
            "provider:create": Create provider
            "provider:read": Get provider
            "provider:update": Update provider
            "provider:delete": Delete provider
            "server:list": List MCP servers
            "server:create": Create MCP server
            "server:read": Get MCP server
            "server:update": Update MCP server
            "server:delete": Delete MCP server
            "server:create_token": Create MCP server token
            "server:tail": Read the debug stream of an MCP server
            "provider_tool:list": List provider tools
            "provider_tool:create": Create provider tool
            "provider_tool:read": Get provider tool
            "provider_tool:update": Update provider tool
            "provider_tool:delete": Delete provider tool
            "provider_tool_interceptor:list": List provider tool interceptors
            "provider_tool_interceptor:save": Save provider tool interceptors
            "provider_resource:list": List provider resources
            "provider_resource:create": Create provider resource
            "provider_resource:read": Get provider resource
            "provider_resource:update": Update provider resource
            "provider_resource:delete": Delete provider resource
            "provider_prompt:list": List provider prompts
            "provider_prompt:create": Create provider prompt
            "provider_prompt:read": Get provider prompt
            "provider_prompt:update": Update provider prompt
            "provider_prompt:delete": Delete provider prompt
            "server:import": Import MCP server
            "server:export": Export MCP server
            "server_analytics:read": Get MCP server analytics
            "server_token:create": Create MCP server token
            "server_tool:list": List MCP server tools
            "server_tool:create": Add a tool to an MCP server
            "server_tool:delete": Remove a tool from an MCP server
            "server_resource:list": List MCP server resources
            "server_resource:create": Add a resource to an MCP server
            "server_resource:delete": Remove a resource from an MCP server
            "server_prompt:list": List MCP server prompts
            "server_prompt:create": Add a prompt to an MCP server
            "server_prompt:delete": Remove a prompt from an MCP server
  parameters:
    ProviderNameContains:
      name: name_contains
      in: query
      schema:
        type: string
    ProviderBaseURLContains:
      name: base_url_contains
      in: query
      schema:
        type: string
    ProviderApiType:
      name: api_type
      in: query
      schema:
        type: string
        enum: ["REST", "MCP"]
    ProviderVisibilityType:
      name: visibility_type
      in: query
      schema:
        type: string
        enum: ["INTERNAL", "PUBLIC"]
    ProviderVerificationStatus:
      name: verification_status
      in: query
      schema:
        type: string
        enum: ["UNVERIFIED", "VERIFIED"]
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        format: int32
    PageToken:
      name: token
      in: query
      description: The nextToken of the previous page
      schema:
        type: string
    McpSessionID:
      name: mcp-session-id
      in: header
      required: false
      schema:
        type: string
    McpProtocolVersion:
      name: mcp-protocol-version
      in: header
      required: false
      schema:
        type: string
        example: "2025-11-25"
    OAuth2State:
      name: state
      in: query
      required: true
      schema:
        type: string
    OAuth2Code:
      name: code
      in: query
      required: true
      schema:
        type: string
  responses:
    Error:
      description: >-
        An error; the HTTP status is error.code, e.g. 401 for a missing or
        invalid token, 404 when not found or 422 for an invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SetupError:
      description: An error of the setup API
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ListGitConnectionsResponse:
      type: object
      properties:
        gitConnections:
          type: array
          items:
            $ref: "#/components/schemas/GitConnection"
    GitConnection:
      type: object
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9]{11}$"
          example: "kSuB9Gf6aD4"
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        provider:
          type: string
          example: "github"
        accountName:
          type: string
          example: "octocat"
        avatarURL:
          type: string
        status:
          type: string
          example: "CONNECTED"
        repositories:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              fullName:
                type: string
              private:
                type: boolean
              url:
                type: string
              cloneURL:
                type: string
    Variable:
      type: object
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9]{11}$"
          example: "kSuB9Gf6aD4"
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        type:
          type: string
          description: "0: INVALID, 1: ENV, 2: SECRET"
          example: "ENV"
        value:
          type: string
          description: The variable's value. Will be '***' if type is SECRET on retrieval.
        name:
          type: string
        serverID:
          type: string
          pattern: "^[A-Za-z0-9]{11}$"
          description: The MCP server the variable belongs to; empty means it applies to every server.
    VariableCreate:
      type: object
      properties:
        type:
          type: string
          description: "0: INVALID, 1: ENV, 2: SECRET"
          example: "ENV"
        value:
          type: string
          description: The variable's value.
        name:
          type: string
        serverID:
          type: string
          pattern: "^[A-Za-z0-9]{11}$"
          description: Scopes the variable to an MCP server; leave empty to apply it to every server.
    VariableUpdate:
      type: object
      properties:
        type:
          type: string
          description: "0: INVALID, 1: ENV, 2: SECRET"
        name:
          type: string
        value:
          type: string
          description: The variable's value.
        serverID:
          type: string
          pattern: "^[A-Za-z0-9]{11}$"
    CreateVariableRequest:
      type: object
      properties:
        variable:
          $ref: "#/components/schemas/VariableCreate"
    CreateVariableResponse:
      type: object
      properties:
        variable:
          $ref: "#/components/schemas/Variable"
    UpdateVariableRequest:
      type: object
