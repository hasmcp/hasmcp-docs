        visibilityType:
          type: string
          description: "0: INVALID, 1: INTERNAL, 2: PUBLIC"
          example: "PUBLIC"
        version:
          type: integer
          format: int32
        gitProvider:
          type: string
          description: The Git hosting provider used for syncing server configuration.
          enum:
            - github
          example: github
        gitRepoFullName:
          type: string
          description: Full repository path in owner/repo format.
          example: hasmcp/remote-mcps
        providers:
          type: array
          description: The providers of the server with the tools, resources and prompts it exposes.
          items:
            $ref: "#/components/schemas/Provider"
    ServerCreate:
      type: object
      properties:
        name:
          type: string
          description: Alphanumeric server name.
          pattern: "^[a-zA-Z0-9]{1,16}$"
          maxLength: 16
          example: MyServer01
        instructions:
          type: string
          description: System instructions for the MCP server that guide its behavior and responses. Max 8000 characters.
          maxLength: 8000
        iconBase64:
          type: string
          description: Base64-encoded PNG image for the server icon. Will be resized to 128x128.
        requestHeadersProxyEnabled:
          type: boolean
          description: When enabled, passes incoming MCP client request headers through to the upstream provider API calls.
        dynamicToolDiscoveryEnabled:
          type: boolean
          description: Activates dynamic tool discovery with searchTool, getToolDefinition, and useTool meta-tools. Requires at least 3 total tools across all providers.
        stateless:
          type: boolean
          description: Enables the stateless MCP transport (SEP-2575). When true, the server accepts self-contained requests without the initialize handshake or an Mcp-Session-Id and exposes the server/discover RPC. The MCP client must also support the stateless spec. Defaults to false.
        visibilityType:
          type: string
          description: "0: INVALID, 1: INTERNAL, 2: PUBLIC"
          example: "PUBLIC"
        gitProvider:
          type: string
          description: The Git hosting provider used for syncing server configuration.
          enum:
            - github
          example: github
        gitRepoFullName:
          type: string
          description: Full repository path in owner/repo format.
          example: hasmcp/remote-mcps
        version:
          type: integer
          format: int32
          description: Optimistic concurrency version. Must match the current server version on update.
        providers:
          type: array
