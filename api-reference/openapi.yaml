openapi: 3.0.4
info:
  title: HasMCP API
  version: "1.0.0"
  description: >-
    API for managing HasMCP: variables, providers and their tools, resources and
    prompts, MCP servers, Git connections and the setup page settings. The
    organization is taken from the access token, so the paths carry no
    organization ID. The MCP endpoints that clients connect to, the public hub
    and the OAuth2 redirects are listed too.
servers:
  - url: https://app.hasmcp.com/api/v1
    description: Manager API (the other APIs override this per path)
security:
  - bearerAuth: []
tags:
  - name: Variables
  - name: Providers
  - name: Provider Tools
  - name: Provider Resources
  - name: Provider Prompts
  - name: Servers
  - name: Server Associations
  - name: Git Connections
  - name: Users
  - name: Hub
  - name: Configurations
  - name: Setup
  - name: MCP
  - name: OAuth2
paths:
  /git-connections:
    get:
      summary: List Git Connections
      operationId: listGitConnections
      tags: ["Git Connections"]
      security:
        - oauth2:
          - "gitconnection:list"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: A list of Git connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGitConnectionsResponse"
  /git-connections/{id}:
    delete:
      summary: Delete Git Connection
      operationId: deleteGitConnection
      tags: ["Git Connections"]
      security:
        - oauth2:
          - "gitconnection:delete"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Git Connection ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "204":
          description: Git Connection deleted
  /variables:
    get:
      summary: List Variables
      operationId: listVariables
      tags: ["Variables"]
      security:
        - oauth2:
          - "variable:list"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: A list of variables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVariablesResponse"
    post:
      summary: Create Variable
      operationId: createVariable
      tags: ["Variables"]
      security:
        - oauth2:
          - "variable:create"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVariableRequest"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "201":
          description: Variable created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateVariableResponse"
  /variables/{id}:
    patch:
      summary: Update Variable
      operationId: updateVariable
      tags: ["Variables"]
      security:
        - oauth2:
          - "variable:update"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Variable ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVariableRequest"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "204":
          description: Variable updated
    delete:
      summary: Delete Variable
      operationId: deleteVariable
      tags: ["Variables"]
      security:
        - oauth2:
          - "variable:delete"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Variable ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "204":
          description: Variable deleted
  /providers:
    get:
      summary: List Providers
      operationId: listProviders
      tags: ["Providers"]
      security:
        - oauth2:
          - "provider:list"
      parameters:
        - $ref: "#/components/parameters/ProviderNameContains"
        - $ref: "#/components/parameters/ProviderBaseURLContains"
        - $ref: "#/components/parameters/ProviderApiType"
        - $ref: "#/components/parameters/ProviderVisibilityType"
        - $ref: "#/components/parameters/ProviderVerificationStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: A list of providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProvidersResponse"
    post:
      summary: Create Provider
      operationId: createProvider
      tags: ["Providers"]
      security:
        - oauth2:
          - "provider:create"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderRequest"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "201":
          description: Provider created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProviderResponse"
  /providers/{id}:
    get:
      summary: Get Provider
      operationId: getProvider
      tags: ["Providers"]
      security:
        - oauth2:
          - "provider:read"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: Provider details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetProviderResponse"
    patch:
      summary: Update Provider
      operationId: updateProvider
      tags: ["Providers"]
      security:
        - oauth2:
          - "provider:update"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProviderRequest"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateProviderResponse"
    delete:
      summary: Delete Provider
      operationId: deleteProvider
      tags: ["Providers"]
      security:
        - oauth2:
          - "provider:delete"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "204":
          description: Provider deleted
  /providers/{id}/sync:
    post:
      summary: Sync Remote MCP or gRPC Provider
      description: >-
        For an MCP provider, lists the tools, resources and prompts of the
        remote MCP server with the user's credentials and mirrors them into the
        provider, along with its instructions and icon. For a gRPC provider,
        discovers the services of the gRPC server with its reflection service,
        or reads them from the uploaded descriptor set, and makes a tool of each
        unary and server streaming method. Existing items are matched by name
        (by full method name for gRPC); new ones are created, changed ones
        updated and the removed ones deleted.
      operationId: syncProviderTools
      tags: ["Providers"]
      security:
        - oauth2:
          - "provider:update"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncProviderRequest"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: Provider tools synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncProviderResponse"
        "422":
          description: >-
            The remote MCP server requires authorization, connect the account
            with the authorize endpoint (error.data.authorizationRequired is true)
        "400":
          description: The gRPC services can't be read from the descriptor set
        "502":
          description: >-
            The remote MCP server failed, or the services of the gRPC server
            couldn't be discovered (e.g. it has no reflection service)
  /providers/{id}/authorize:
    post:
      summary: Connect Provider Account
      description: >-
        Starts the oauth2 authorization of the current user with the provider.
        For remote MCP providers the authorization server is discovered and an
        oauth2 client is registered dynamically when the provider has none. The
        tokens are stored as the provider's ACCESS_TOKEN and REFRESH_TOKEN
        secret variables and renewed automatically.
      operationId: authorizeProvider
      tags: ["Providers"]
      security:
        - oauth2:
          - "provider:update"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
        - name: serverID
          in: query
          required: false
          description: >-
            Connects the account for this MCP server only; its tokens are saved
            as variables of the server. Without it the account is shared by
            every server.
          schema:
            type: string
            pattern: "^[A-Za-z0-9]{11}$"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: The url to send the user to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeProviderResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /providers/{id}/tools:
    get:
      summary: List Provider Tools
      operationId: listProviderTools
      tags: ["Provider Tools"]
      security:
        - oauth2:
          - "provider_tool:list"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: A list of provider tools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProviderToolsResponse"
    post:
      summary: Create Provider Tool
      operationId: createProviderTool
      tags: ["Provider Tools"]
      security:
        - oauth2:
          - "provider_tool:create"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderToolRequest"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "201":
          description: Tool created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProviderToolResponse"
  /providers/{id}/tools/{toolID}:
    get:
      summary: Get Provider Tool
      operationId: getProviderTool
      tags: ["Provider Tools"]
      security:
        - oauth2:
          - "provider_tool:read"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
        - name: toolID
          in: path
          required: true
          schema:
            type: string
            description: Tool ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: Tool details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetProviderToolResponse"
    patch:
      summary: Update Provider Tool
      operationId: updateProviderTool
      tags: ["Provider Tools"]
      security:
        - oauth2:
          - "provider_tool:update"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
        - name: toolID
          in: path
          required: true
          schema:
            type: string
            description: Tool ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProviderToolRequest"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: Tool updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateProviderToolResponse"
    delete:
      summary: Delete Provider Tool
      operationId: deleteProviderTool
      tags: ["Provider Tools"]
      security:
        - oauth2:
          - "provider_tool:delete"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
        - name: toolID
          in: path
          required: true
          schema:
            type: string
            description: Tool ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "204":
          description: Tool deleted
  /providers/{id}/tools/{toolID}/interceptors:
    get:
      summary: List Provider Tool Interceptors
      operationId: listProviderToolInterceptors
      tags: ["Provider Tools"]
      security:
        - oauth2:
          - "provider_tool_interceptor:list"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
        - name: toolID
          in: path
          required: true
          schema:
            type: string
            description: Tool ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: A list of provider tool interceptors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProviderToolInterceptorsResponse"
    put:
      summary: Save Provider Tool Interceptors
      operationId: saveProviderToolInterceptors
      tags: ["Provider Tools"]
      security:
        - oauth2:
          - "provider_tool_interceptor:save"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
        - name: toolID
          in: path
          required: true
          schema:
            type: string
            description: Tool ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProviderToolInterceptorsRequest"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "204":
          description: Interceptors saved successfully
  /servers:
    get:
      summary: List MCP Servers
      operationId: listServers
      tags: ["Servers"]
      security:
        - oauth2:
          - "server:list"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: A list of MCP servers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServersResponse"
    post:
      summary: Create MCP Server
      operationId: createServer
      tags: ["Servers"]
      security:
        - oauth2:
          - "server:create"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerRequest"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "201":
          description: MCP Server created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateServerResponse"
  /servers/import:
    post:
      summary: Import MCP Server
      operationId: importServer
      tags: ["Servers"]
      security:
        - oauth2:
          - "server:import"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportServer"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "201":
          description: MCP Server imported successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetServerResponse"
  /servers/{id}:
    get:
      summary: Get MCP Server
      operationId: getServer
      tags: ["Servers"]
      security:
        - oauth2:
          - "server:read"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: MCP Server ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: MCP Server details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetServerResponse"
    patch:
      summary: Update MCP Server
      operationId: updateServer
      tags: ["Servers"]
      security:
        - oauth2:
          - "server:update"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: MCP Server ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServerRequest"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: MCP Server updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateServerResponse"
    delete:
      summary: Delete MCP Server
      operationId: deleteServer
      tags: ["Servers"]
      security:
        - oauth2:
          - "server:delete"
      parameters:
        - name: id
          in: path
          required: true
          description: MCP Server ID
          schema:
            type: string
            description: Git Connection ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "204":
          description: MCP Server deleted
  /servers/{id}/export:
    get:
      summary: Export MCP Server
      operationId: exportServer
      tags: ["Servers"]
      security:
        - oauth2:
          - "server:export"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: MCP Server ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: MCP Server exported successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportServer"
  /servers/{id}/tokens:
    post:
      summary: Create MCP Server Token
      operationId: createServerToken
      tags: ["Servers"]
      security:
        - oauth2:
          - "server_token:create"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: MCP Server ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerTokenRequest"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "201":
          description: MCP Server Token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateServerTokenResponse"
  /servers/{id}/tools:
    get:
      summary: List MCP Server Tools
      operationId: listServerTools
      tags: ["Server Associations"]
      security:
        - oauth2:
          - "server_tool:list"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: MCP Server ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: A list of associated tools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServerToolsResponse"
    post:
      summary: Create MCP Server Tool Association
      operationId: createServerTool
      tags: ["Server Associations"]
      security:
        - oauth2:
          - "server_tool:create"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: MCP Server ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerToolRequest"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "201":
          description: Tool associated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateServerToolResponse"
  /servers/{id}/tools/{toolID}:
    delete:
      summary: Delete MCP Server Tool Association
      operationId: deleteServerTool
      tags: ["Server Associations"]
      security:
        - oauth2:
          - "server_tool:delete"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: MCP Server ID
        - name: toolID
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/Error"
        "204":
          description: Tool association deleted
  /providers/{id}/resources:
    get:
      summary: List Provider Resources
      operationId: listProviderResources
      tags: ["Provider Resources"]
      security:
        - oauth2:
          - "provider_resource:list"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: A list of provider resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProviderResourcesResponse"
    post:
      summary: Create Provider Resource
      operationId: createProviderResource
      tags: ["Provider Resources"]
      security:
        - oauth2:
          - "provider_resource:create"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderResourceRequest"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "201":
          description: Provider Resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProviderResourceResponse"
  /providers/{id}/resources/{resourceID}:
    get:
      summary: Get Provider Resource
      operationId: getProviderResource
      tags: ["Provider Resources"]
      security:
        - oauth2:
          - "provider_resource:read"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
        - name: resourceID
          in: path
          required: true
          schema:
            type: string
            description: Resource ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: Provider Resource details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetProviderResourceResponse"
    patch:
      summary: Update Provider Resource
      operationId: updateProviderResource
      tags: ["Provider Resources"]
      security:
        - oauth2:
          - "provider_resource:update"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
        - name: resourceID
          in: path
          required: true
          schema:
            type: string
            description: Resource ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProviderResourceRequest"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "204":
          description: Provider Resource updated
    delete:
      summary: Delete Provider Resource
      operationId: deleteProviderResource
      tags: ["Provider Resources"]
      security:
        - oauth2:
          - "provider_resource:delete"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
        - name: resourceID
          in: path
          required: true
          schema:
            type: string
            description: Resource ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "204":
          description: Provider Resource deleted
  /providers/{id}/prompts:
    get:
      summary: List Provider Prompts
      operationId: listProviderPrompts
      tags: ["Provider Prompts"]
      security:
        - oauth2:
          - "provider_prompt:list"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: A list of provider prompts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProviderPromptsResponse"
    post:
      summary: Create Provider Prompt
      operationId: createProviderPrompt
      tags: ["Provider Prompts"]
      security:
        - oauth2:
          - "provider_prompt:create"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderPromptRequest"
      responses:
        default:
          $ref: "#/components/responses/Error"
        "201":
          description: Provider Prompt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProviderPromptResponse"
  /providers/{id}/prompts/{promptID}:
    get:
      summary: Get Provider Prompt
      operationId: getProviderPrompt
      tags: ["Provider Prompts"]
      security:
        - oauth2:
          - "provider_prompt:read"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Provider ID
        - name: promptID
          in: path
          required: true
          schema:
            type: string
            description: Prompt ID
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: Provider Prompt details
